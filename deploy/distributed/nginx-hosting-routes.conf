    # Dedicated ZeroTier HTTPS endpoints. Never forward arbitrary commands.
    # Machine-scoped bearer authentication and central root opt-in are mandatory.
    location = /v1/agent/hosting-poll {
        auth_basic off;
        limit_except POST { deny all; }
        client_max_body_size 2k;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/devmcp-admin/public/agent-hosting-poll.php;
        fastcgi_param HTTPS on;
        fastcgi_param DEVMCP_DISTRIBUTED_CONFIG /etc/devmcp-admin/distributed.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location = /v1/agent/hosting-result {
        auth_basic off;
        limit_except POST { deny all; }
        client_max_body_size 12k;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/devmcp-admin/public/agent-hosting-result.php;
        fastcgi_param HTTPS on;
        fastcgi_param DEVMCP_DISTRIBUTED_CONFIG /etc/devmcp-admin/distributed.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
