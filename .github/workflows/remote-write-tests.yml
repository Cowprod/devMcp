name: Remote write integration checks
on:
  pull_request:
    paths:
      - 'bin/remote-*.php'
      - 'bin/devmcp-remote-write-retention'
      - 'bin/distributed-agent.php'
      - 'src/Mcp/RemoteTools.php'
      - 'public/agent-job-poll.php'
      - 'public/agent-job-result.php'
      - 'deploy/distributed/prepare-remote-write-pilot.sh'
      - 'deploy/distributed/upgrade-agent-readonly.sh'
      - 'deploy/distributed/enable-remote-mcp.sh'
      - 'tests/integration/remote-write-*.php'
      - '.github/workflows/remote-write-tests.yml'
  push:
    branches:
      - feat/remote-write-policy-v1
jobs:
  remote-write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
      - name: PHP syntax
        run: |
          php -l bin/devmcp-remote-write-retention
          for file in bin/remote-*.php bin/distributed-agent.php src/Mcp/RemoteTools.php public/agent-job-poll.php public/agent-job-result.php tests/integration/remote-write-*.php tests/Distributed/RemoteWriteMySqlIntegrationTest.php; do
            php -l "$file"
          done
      - name: Deployment script syntax
        run: |
          bash -n deploy/distributed/prepare-remote-write-pilot.sh
          bash -n deploy/distributed/upgrade-agent-readonly.sh
          bash -n deploy/distributed/enable-remote-mcp.sh
      - name: Root-owned executable agent config trust tests
        run: |
          set -euo pipefail
          fixture=/etc/devmcp-ci-root-policy
          sudo install -d -m 0755 -o root -g root "$fixture"
          trap 'sudo rm -f "$fixture/agent.php" "$fixture/link.php"; sudo rmdir "$fixture"' EXIT
          printf '%s\n' '<?php return [];' | sudo tee "$fixture/agent.php" >/dev/null
          sudo chown root:root "$fixture/agent.php"
          sudo chmod 0644 "$fixture/agent.php"
          php -r 'require "bin/remote-local-policy.php"; if (!remoteLocalPolicyFileTrusted("/etc/devmcp-ci-root-policy/agent.php")) exit(1);'
          sudo chmod 0666 "$fixture/agent.php"
          php -r 'require "bin/remote-local-policy.php"; if (remoteLocalPolicyFileTrusted("/etc/devmcp-ci-root-policy/agent.php")) exit(1);'
          sudo chmod 0644 "$fixture/agent.php"
          sudo chmod 0777 "$fixture"
          php -r 'require "bin/remote-local-policy.php"; if (remoteLocalPolicyFileTrusted("/etc/devmcp-ci-root-policy/agent.php")) exit(1);'
          sudo chmod 0755 "$fixture"
          sudo ln -s "$fixture/agent.php" "$fixture/link.php"
          php -r 'require "bin/remote-local-policy.php"; if (remoteLocalPolicyFileTrusted("/etc/devmcp-ci-root-policy/link.php")) exit(1);'
      - name: Retention CLI refuses untrusted executable PHP config
        run: |
          set -euo pipefail
          config="$(mktemp /tmp/devmcp-retention-untrusted-XXXXXX.php)"
          trap 'rm -f "$config"' EXIT
          printf '%s\n' '<?php echo "UNTRUSTED_CONFIG_LOADED\\n"; return [];' > "$config"
          set +e
          output="$(DEVMCP_DISTRIBUTED_CONFIG="$config" php bin/devmcp-remote-write-retention 2>&1)"
          status=$?
          set -e
          test "$status" -eq 2
          test "$output" = 'Remote-write retention: configuration unavailable'
      - name: Primitive security tests
        run: php tests/integration/remote-write-text-test.php
      - name: Server, queue and agent gate tests
        run: php tests/integration/remote-write-gates-test.php
