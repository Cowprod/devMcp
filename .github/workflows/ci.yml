name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - name: Lint PHP entrypoints
        run: |
          php -l bin/devmcp
          php -l bin/devmcp-worker
          php -l bin/devmcp-doctor
          php -l bin/devmcp-workspace-sync
          php -l public/index.php
      - name: Lint deployment scripts
        run: |
          sh -n deploy/install-platformio.sh
          sh -n deploy/apply-vm-runtime.sh
      - run: composer test
