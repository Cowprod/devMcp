name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - name: Lint PHP entrypoints
        run: |
          php -l bin/devmcp
          php -l bin/devmcp-worker
          php -l bin/devmcp-doctor
          php -l bin/import-global-projects-to-sql.php
          php -l src/Project/SqlProjectConfiguration.php
          php -l src/Project/ProvisioningStore.php
          php -l bin/devmcp-workspace-sync
          php -l bin/devmcp-workspace-inspect
          php -l bin/devmcp-node-task
          php -l bin/devmcp-pm2-service
          php -l bin/devmcp-touchdeck-ota
          php -l public/index.php
          php -l public/distributed-admin.php
          php -l src/Distributed/Admin/LocalProjectSnapshot.php
          php -l src/Distributed/Admin/AndroidSnapshot.php
          php -l bin/devmcp-admin-projects-export
          php -l bin/devmcp-admin-android
          python3 -m py_compile bin/devmcp-serial-capture
      - name: Lint deployment scripts
        run: |
          sh -n deploy/self-update.sh
          sh -n deploy/install-platformio.sh
          sh -n deploy/apply-vm-runtime.sh
          sh -n deploy/install-touchdeck-ota.sh
          bash -n deploy/distributed/install-local-admin-bridge.sh
          bash -n deploy/distributed/apply-local-admin-bridge.sh
      - name: Smoke-test workspace inspection boundaries
        run: |
          mkdir -p /tmp/devmcp-inspect-fixture/sub
          printf 'hello\\n' > /tmp/devmcp-inspect-fixture/sub/test.txt
          printf 'secret\\n' > /tmp/devmcp-inspect-fixture/.env
          ln -s /etc/passwd /tmp/devmcp-inspect-fixture/escape
          cd /tmp/devmcp-inspect-fixture
          php "$GITHUB_WORKSPACE/bin/devmcp-workspace-inspect" list . | grep -q 'sub'
          php "$GITHUB_WORKSPACE/bin/devmcp-workspace-inspect" stat sub/test.txt | grep -q 'file'
          php "$GITHUB_WORKSPACE/bin/devmcp-workspace-inspect" read sub/test.txt | grep -q 'hello'
          ! php "$GITHUB_WORKSPACE/bin/devmcp-workspace-inspect" read .env
          ! php "$GITHUB_WORKSPACE/bin/devmcp-workspace-inspect" read escape
          ! php "$GITHUB_WORKSPACE/bin/devmcp-workspace-inspect" read ../passwd
          php "$GITHUB_WORKSPACE/bin/devmcp-workspace-inspect" find . js | grep -q 'entries'
          ! php "$GITHUB_WORKSPACE/bin/devmcp-workspace-inspect" find . arbitrary
      - run: composer test
