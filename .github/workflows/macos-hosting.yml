name: macOS project hosting
on: [push, pull_request]
jobs:
  launchd:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, posix
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lint macOS agent and installer
        run: |
          php -l bin/distributed-agent-macos.php
          php -l bin/update-agent-macos.php
          php -l bin/configure-macos-launcher.php
          php -l src/Project/MacProjectRuntime.php
          php -l src/Project/MacAndroidRuntime.php
          php -l src/Project/MobileReleaseIndex.php
          php -l src/Project/MobileBuildRetention.php
          php -l src/Project/MacSigningTeams.php
          php -l src/Project/MacIosRuntime.php
          php -l src/Project/MacCordovaIos.php
          php -l src/Project/MacIosArtifactUpload.php
          bash -n deploy/distributed/install-agent-macos.sh
          node --check bin/devmcp-static-server.mjs
      - name: Deploy real LaunchAgents and verify PHP sessions and Node WebSocket
        env:
          DEVMCP_RUN_MAC_TESTS: '1'
        run: |
          export DEVMCP_TEST_NODE="$(command -v node)"
          export DEVMCP_TEST_BASE="$RUNNER_TEMP/devmcp-launcher-test"
          php bin/configure-macos-launcher.php "$DEVMCP_TEST_BASE" --prepare
          php -r 'file_put_contents("agent-settings.php","<?php return ".var_export(["php"=>PHP_BINARY,"node"=>getenv("DEVMCP_TEST_NODE"),"launcher"=>getenv("DEVMCP_TEST_BASE")."/devMcp.app/Contents/MacOS/devmcp-launcher"],true).";");'
          php -d zend.assertions=1 -d assert.exception=1 tests/distributed/macos-project-runtime-smoke.php
      - name: Discover live signing teams and reject unknown teams before build retention
        env:
          DEVMCP_RUN_MAC_TESTS: '1'
        run: php -d zend.assertions=1 -d assert.exception=1 tests/Distributed/macos-ios-signing-smoke.php
      - name: Build a real iOS simulator app and export its ZIP
        env:
          DEVMCP_RUN_MAC_TESTS: '1'
        run: php -d zend.assertions=1 -d assert.exception=1 tests/Distributed/macos-ios-build-smoke.php
      - name: Verify server certificate with the native Apple SSL trust policy
        run: php -d zend.assertions=1 -d assert.exception=1 tests/Distributed/admin-tls-certificates-smoke.php
      - name: Prepare and compile a real Cordova app with a native plugin and hook
        env:
          DEVMCP_RUN_MAC_TESTS: '1'
        run: |
          export DEVMCP_TEST_NODE="$(command -v node)"
          php -d zend.assertions=1 -d assert.exception=1 tests/Distributed/macos-cordova-ios-smoke.php
