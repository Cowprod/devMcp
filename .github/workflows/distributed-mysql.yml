name: Distributed MySQL integration
on: [push, pull_request]
jobs:
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testroot
          MYSQL_DATABASE: devmcp_test
          MYSQL_USER: devmcp_test
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -ptestroot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
      - run: composer install --no-interaction --prefer-dist
      - name: Apply migrations
        env:
          MYSQL_PWD: testpass
        run: |
          mysql -h 127.0.0.1 -u devmcp_test devmcp_test < database/migrations/001_distributed_registry.sql
          mysql -h 127.0.0.1 -u devmcp_test devmcp_test < database/migrations/002_policy_revision.sql
          mysql -h 127.0.0.1 -u devmcp_test devmcp_test < migrations/20261031_project_provisioning.sql
          mysql -h 127.0.0.1 -u devmcp_test devmcp_test < migrations/20261031_sql_project_registry.sql
          mysql -h 127.0.0.1 -u devmcp_test devmcp_test < migrations/20261101_preview_port_reservation.sql
          mysql -h 127.0.0.1 -u devmcp_test devmcp_test < migrations/20261102_project_runtime_catalog.sql
          mysql -h 127.0.0.1 -u devmcp_test devmcp_test < migrations/20261102_agent_zerotier_address.sql
      - name: Apply and reapply dedicated hosting signed-commit migrations
        env:
          MYSQL_PWD: testpass
        run: |
          mysql -h 127.0.0.1 -u devmcp_test devmcp_test < database/migrations/006_remote_hosting_jobs.sql
          mysql -h 127.0.0.1 -u devmcp_test devmcp_test < database/migrations/007_remote_hosting_signed_commit.sql
          mysql -h 127.0.0.1 -u devmcp_test devmcp_test < database/migrations/007_remote_hosting_signed_commit.sql
          mysql -h 127.0.0.1 -u devmcp_test -N -B devmcp_test \
            -e "SHOW COLUMNS FROM dm_remote_hosting_job LIKE 'action_name'" |
            grep -Fq 'commit-initial'
      - name: SQL integration tests
        env:
          DEVMCP_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=devmcp_test;charset=utf8mb4
          DEVMCP_TEST_MYSQL_USER: devmcp_test
          DEVMCP_TEST_MYSQL_PASSWORD: testpass
        run: vendor/bin/phpunit tests/Distributed/MySqlIntegrationTest.php

      - name: SQL project registry integration tests
        env:
          DEVMCP_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=devmcp_test;charset=utf8mb4
          DEVMCP_TEST_MYSQL_USER: devmcp_test
          DEVMCP_TEST_MYSQL_PASSWORD: testpass
        run: vendor/bin/phpunit tests/Distributed/SqlProjectMySqlIntegrationTest.php

      - name: Preview port MySQL integration tests
        env:
          DEVMCP_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=devmcp_test;charset=utf8mb4
          DEVMCP_TEST_MYSQL_USER: devmcp_test
          DEVMCP_TEST_MYSQL_PASSWORD: testpass
        run: vendor/bin/phpunit tests/Distributed/PreviewPortMySqlIntegrationTest.php

      - name: Remote agent preview-port reservation integration
        env:
          DEVMCP_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=devmcp_test;charset=utf8mb4
          DEVMCP_TEST_MYSQL_USER: devmcp_test
          DEVMCP_TEST_MYSQL_PASSWORD: testpass
        run: vendor/bin/phpunit tests/Distributed/RemotePreviewPortClaimsMySqlTest.php

      - name: Preview port migration idempotency test
        env:
          DEVMCP_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=devmcp_test;charset=utf8mb4
          DEVMCP_TEST_MYSQL_USER: devmcp_test
          DEVMCP_TEST_MYSQL_PASSWORD: testpass
        run: vendor/bin/phpunit tests/Distributed/PreviewPortMigrationTest.php

      - name: Project runtime catalogue persistence and guarding
        env:
          DEVMCP_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=devmcp_test;charset=utf8mb4
          DEVMCP_TEST_MYSQL_USER: devmcp_test
          DEVMCP_TEST_MYSQL_PASSWORD: testpass
        run: vendor/bin/phpunit tests/Distributed/ProjectRuntimeCatalogMySqlTest.php

      - name: Source-verified remote ZeroTier identity SQL guards
        env:
          DEVMCP_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=devmcp_test;charset=utf8mb4
          DEVMCP_TEST_MYSQL_USER: devmcp_test
          DEVMCP_TEST_MYSQL_PASSWORD: testpass
        run: vendor/bin/phpunit tests/Distributed/VerifiedZeroTierAddressMySqlTest.php

      - name: Agent ZeroTier address migration idempotency
        env:
          DEVMCP_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=devmcp_test;charset=utf8mb4
          DEVMCP_TEST_MYSQL_USER: devmcp_test
          DEVMCP_TEST_MYSQL_PASSWORD: testpass
        run: vendor/bin/phpunit tests/Distributed/AgentZeroTierAddressMigrationTest.php

      - name: Runtime catalogue migration idempotency
        env:
          DEVMCP_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=devmcp_test;charset=utf8mb4
          DEVMCP_TEST_MYSQL_USER: devmcp_test
          DEVMCP_TEST_MYSQL_PASSWORD: testpass
        run: vendor/bin/phpunit tests/Distributed/ProjectRuntimeMigrationTest.php

      - name: Project test action SQL migration and existing project enablement
        env:
          DEVMCP_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=devmcp_test;charset=utf8mb4
          DEVMCP_TEST_MYSQL_USER: devmcp_test
          DEVMCP_TEST_MYSQL_PASSWORD: testpass
        run: vendor/bin/phpunit tests/Distributed/ProjectTestActionMigrationTest.php

      - name: SQL global.php migration smoke test
        env:
          DEVMCP_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=devmcp_test;charset=utf8mb4
          DEVMCP_TEST_MYSQL_USER: devmcp_test
          DEVMCP_TEST_MYSQL_PASSWORD: testpass
        run: vendor/bin/phpunit tests/Distributed/SqlProjectImportSmokeTest.php
